services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: drcp-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=file:/app/prisma/dev.db
      - JWT_SECRET=${JWT_SECRET:-production-grade-jwt-secret-drcp-platform}
      - CACHE_DRIVER=${CACHE_DRIVER:-memory}
      - REPORTS_CACHE_TTL=${REPORTS_CACHE_TTL:-120}
      - GEO_CACHE_TTL=${GEO_CACHE_TTL:-86400}
      - EXTERNAL_TIMEOUT_MS=${EXTERNAL_TIMEOUT_MS:-3000}
      - SEED_ADMIN_USERNAME=${SEED_ADMIN_USERNAME:-admin}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-Admin@123}
      - SEED_ADMIN_API_KEY=${SEED_ADMIN_API_KEY:-mock_test_admin_key}
      - SEED_CONTRIBUTOR_USERNAME=${SEED_CONTRIBUTOR_USERNAME:-contributor}
      - SEED_CONTRIBUTOR_PASSWORD=${SEED_CONTRIBUTOR_PASSWORD:-Contributor@123}
      - SEED_CONTRIBUTOR_API_KEY=${SEED_CONTRIBUTOR_API_KEY:-mock_test_contributor_key}
      - SEED_VIEWER_USERNAME=${SEED_VIEWER_USERNAME:-viewer}
      - SEED_VIEWER_PASSWORD=${SEED_VIEWER_PASSWORD:-Viewer@123}
      - SEED_VIEWER_API_KEY=${SEED_VIEWER_API_KEY:-mock_test_viewer_key}
      - TEST_USER_PASSWORD=${TEST_USER_PASSWORD:-TestSecurePass@123}
    volumes:
      - drcp-db:/app/prisma
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: drcp-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  drcp-db:
    name: drcp-sqlite-data
